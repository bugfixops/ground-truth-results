<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger graph</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--card:#f6f8fa;--acc:#0969da;--gui:#8250df;--call:#57606a;--life:#1a7f37;--sys:#bc4c00;--async:#0a7ea4;--fw:#9a6700;--bad:#cf222e;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--card:#161b22;--acc:#58a6ff;--gui:#bc8cff;--call:#8b949e;--life:#3fb950;--sys:#ffa657;--async:#39c5cf;--fw:#d29922;--bad:#ff7b72;--ok:#3fb950}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header .sub{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px}nav button{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label.opt{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center}
main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);padding:10px;overflow:auto;max-height:calc(100vh - 52px)}
section.pane{padding:14px 18px;overflow:auto;max-height:calc(100vh - 52px)}
@media(max-width:800px){main{grid-template-columns:1fr}aside{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}section.pane{max-height:none}}
input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:8px;font:inherit}
.item{padding:3px 8px;border-radius:5px;cursor:pointer;word-break:break-all;font-size:13px}
.item:hover{background:var(--card)}.item.on{background:var(--acc);color:#fff}
.grp{font-size:11px;color:var(--mut);margin:10px 0 3px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}.dot.DEAD{background:var(--bad)}.dot.FRAMEWORK_ONLY{background:var(--fw)}
h2{font-size:17px;margin:0 0 4px}h3{font-size:14px;margin:18px 0 6px}
.muted{color:var(--mut);font-size:12px}
.card{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;margin:4px 0}
.node{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--bg);font-weight:600;word-break:break-all}
.node.screen{border-color:var(--acc);color:var(--acc)}.node.dead{border-color:var(--bad)}
.arrow{margin:2px 0 2px 14px;padding:6px 10px;border-left:3px solid var(--line);font-size:13px}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;color:#fff;margin-right:6px;vertical-align:1px}
.k-GUI{background:var(--gui)}.k-CALL{background:var(--call)}.k-LIFECYCLE{background:var(--life)}.k-SYSTEM{background:var(--sys)}.k-ASYNC{background:var(--async)}.k-INTENT{background:var(--async)}.k-RESULT{background:var(--async)}.k-FRAMEWORK{background:var(--fw)}.k-ENTERS{background:var(--mut)}.k-ENTRY{background:var(--life)}.k-REGISTER{background:var(--mut)}
.gui{color:var(--gui)}.guard{color:var(--mut);font-style:italic}.warn{color:var(--sys)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-weight:600;font-size:12px}
.chip{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:0 8px;margin:1px 3px 1px 0;cursor:pointer;font-size:12px}.chip:hover{background:var(--acc);color:#fff}
details>summary{cursor:pointer;color:var(--mut);font-size:12px}
svg{max-width:100%;height:auto;background:var(--bg)}svg text{fill:var(--fg);font-size:12px}
.mapnode rect{fill:var(--card);stroke:var(--acc);stroke-width:1.5;rx:8}.mapnode.on rect{fill:var(--acc)}.mapnode.on text{fill:#fff}.mapnode{cursor:pointer}
.medge{fill:none;stroke:var(--mut);stroke-width:1.2;opacity:.3}.medge.hl{stroke:var(--acc);stroke-width:2.4;opacity:1}.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.mapwrap svg{max-width:none}
.legend span{margin-right:10px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1 id="title">Trigger graph</h1>
  <nav><button id="t-map">Page map</button><button id="t-page">Page → next pages</button><button id="t-meth">Method → trigger path</button></nav>
  <label class="opt"><input type="checkbox" id="setup"> Include "needs prior state" edges</label>
  <label class="opt"><input type="checkbox" id="bg"> Show paused/exit pages on the map</label>
  <span class="sub" id="stats"></span>
</header>
<main><aside id="side"></aside><section class="pane" id="pane"></section></main>

  const m = state.meth, prev = bfs(), vs = Object.keys(prev).filter(n => BASE(n) === m);
  const v = G.verdict[m];
  pane.append(el('h2', {text: m}), el('div', {class: 'muted', text: 'Verdict: ' + v + (G.dead[m] ? ' — ' + G.dead[m] : '') + (G.framework_only[m] ? ' — ' + G.framework_only[m] : '')}));
  if (!vs.length) {
    const noway = v === 'DEAD' || v === 'FRAMEWORK_ONLY';
    pane.append(el('div', {class: 'card warn', text: noway ? 'No incoming edges: see the verdict above (dead code / framework-only).' : (state.setup ? 'The graph has no path from the start page to this method.' : 'No path unless "needs prior state" edges are included; tick the box above and look again.')}));
  }
  // one candidate route per distinct incoming edge, shortest first
  const cands = [];
  (inn[m] || []).forEach(e => {
    if (e.kind === 'REGISTER' || !(e.src in prev)) return;
    if (e.needs_state && !state.setup) return;
    cands.push(pathTo(e.src, prev).concat([e]));
  });
  cands.sort((a, b) => a.length - b.length);
  const uniq = []; const seenSig = new Set();
  cands.forEach(p => { const s = p[p.length - 1].id; if (!seenSig.has(s)) { seenSig.add(s); uniq.push(p); } });
  if (uniq.length) {
    pane.append(el('h3', {text: `Path from the start to here (shortest: ${uniq[0].length} steps; ${uniq.length} distinct entry edge${uniq.length === 1 ? '' : 's'}; the 3 shortest are shown)`}));
    uniq.slice(0, 3).forEach((p, i) => {
      const box = el('div', {class: 'card'}, el('div', {class: 'muted', text: 'Path ' + (i + 1) + ' · ' + p.length + ' steps'}));
      box.append(nodeBox(p[0].src));
      p.forEach(e => { box.append(edgeCard(e), nodeBox(e.dst)); });
      pane.append(box);
    });
  }
  const ins = (inn[m] || []);
  pane.append(el('h3', {text: `All incoming edges (${ins.length}): every known way to trigger it`}));
  ins.forEach(e => pane.append(el('div', {class: 'card'}, el('span', {class: 'node', text: e.src}), edgeCard(e))));
  const outs = Object.keys(out).filter(k => BASE(k) === m).flatMap(k => out[k]).filter(e => e.kind !== 'REGISTER');
  pane.append(el('h3', {text: `What this method triggers next (${outs.length})`}));
  outs.forEach(e => pane.append(el('div', {class: 'card'}, edgeCard(e), nodeBox(e.dst))));
}

// ---------- sidebar & shell -------------------------------------------------------------------
function renderSide(side) {
  const search = el('input', {type: 'search', placeholder: state.tab === 'meth' ? 'Filter methods…' : 'Filter pages…', value: state.q});
  search.addEventListener('input', () => { state.q = search.value; renderSideList(side, list); });
  const list = el('div', {});
  side.append(search, list); renderSideList(side, list);
}
function renderSideList(side, list) {
  list.textContent = '';
  const q = state.q.toLowerCase();
  if (state.tab === 'meth') {
    const byc = {};
    G.methods.filter(m => m.toLowerCase().includes(q)).forEach(m => (byc[m.split('.')[0]] = byc[m.split('.')[0]] || []).push(m));
    Object.keys(byc).forEach(c => {
      list.append(el('div', {class: 'grp', text: c}));
      byc[c].forEach(m => list.append(el('div', {class: 'item' + (m === state.meth ? ' on' : ''), onclick: () => go('meth', m)}, el('span', {class: 'dot ' + G.verdict[m]}), m.slice(c.length + 1))));
    });
  } else {
    [...new Set(Object.keys(G.screens).map(BASE))].filter(p => p.toLowerCase().includes(q)).forEach(p =>
      list.append(el('div', {class: 'item' + (p === state.page ? ' on' : ''), onclick: () => go('page', p), text: p})));
  }
}
function render() {
  if (G.title) { document.getElementById('title').textContent = G.title; document.title = G.title; }
  document.getElementById('stats').textContent = `${G.methods.length} methods · ${Object.keys(G.screens).length} pages · ${G.edges.length} edges`;
  ['map', 'page', 'meth'].forEach(t => document.getElementById('t-' + t).classList.toggle('on', state.tab === t));
  const side = document.getElementById('side'), pane = document.getElementById('pane');
  side.textContent = ''; pane.textContent = '';
  if (state.tab !== 'map') renderSide(side); else side.append(el('div', {class: 'legend'}, el('div', {class: 'grp', text: 'Edge kinds'}),
    ['GUI', 'CALL', 'LIFECYCLE', 'SYSTEM', 'ASYNC', 'INTENT', 'RESULT', 'FRAMEWORK', 'ENTERS', 'ENTRY'].map(k => el('div', {}, el('span', {class: 'badge k-' + k, text: k})))),
    el('div', {class: 'grp', text: 'Method verdict'}), el('div', {}, el('span', {class: 'dot'}), 'Reachable'), el('div', {}, el('span', {class: 'dot DEAD'}), 'Dead code'), el('div', {}, el('span', {class: 'dot FRAMEWORK_ONLY'}), 'Framework-only'));
  ({map: renderMap, page: renderPage, meth: renderMeth})[state.tab](pane);
}
document.getElementById('t-map').onclick = () => { state.tab = 'map'; render(); };
document.getElementById('t-page').onclick = () => { state.tab = 'page'; state.q = ''; render(); };
document.getElementById('t-meth').onclick = () => { state.tab = 'meth'; state.q = ''; render(); };
document.getElementById('setup').onchange = ev => { state.setup = ev.target.checked; render(); };
document.getElementById('bg').onchange = ev => { state.bg = ev.target.checked; render(); };
render();
</script>
</body>
