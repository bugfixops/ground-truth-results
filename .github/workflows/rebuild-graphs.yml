name: Rebuild graphs

# Rebuilds the trigger graphs and runs the eight checks for the apps listed in handoff/REBUILD_REQUEST.txt
# (one app per line, or "all"; lines starting with # are ignored), then commits graphs/<App>/out/ and
# graphs/<App>/scratch/ci_latest/ back to this branch. Change REBUILD_REQUEST.txt (for example, update its
# "# request" line) and push it to start a run. See handoff/MUSE_FINISH_ALL.md, section 2.
on:
  push:
    branches: [work-2026-10-31]
    paths: [handoff/REBUILD_REQUEST.txt]
  workflow_dispatch:
    inputs:
      apps:
        description: 'App names separated by spaces, or all'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: rebuild-graphs
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work-2026-10-31
          fetch-depth: 1

      - name: Rebuild and check
        env:
          EVENT: ${{ github.event_name }}
          IN_APPS: ${{ inputs.apps }}
        run: |
          python3 --version
          if [ "$EVENT" = "workflow_dispatch" ]; then apps="$IN_APPS"; else apps=$(grep -v '^#' handoff/REBUILD_REQUEST.txt | tr ',\n' '  '); fi
          echo "apps: $apps"
          bash handoff/ci/rebuild.sh $apps

      - name: Commit outputs
        run: |
          git config user.name bugfixops
          git config user.email bugfixops@users.noreply.github.com
          git add -A graphs/*/out graphs/*/scratch/ci_latest
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "[ci] rebuild and checks ($(git diff --cached --name-only | cut -d/ -f2 | sort -u | tr '\n' ' '))"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin work-2026-10-31 && git push -q origin HEAD:work-2026-10-31; then exit 0; fi
            sleep 15
          done
          exit 1
